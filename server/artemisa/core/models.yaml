# Generado desde docs/04-MODELOS.md. Si cambia allá, se actualiza acá.
# Fase 0: todo pasa por Vercel AI Gateway. `model` es el id del gateway (prefijo
# del creador); `provider` es quien lo sirve, fijado con providerOptions.gateway.only.
verified_at: 2026-09-21

roles:
  describe:
    provider: openai
    model: openai/gpt-4.1-nano
    temperature: 0.2
    max_output_tokens: 80
    image_detail: low
    timeout_s: 8
    fallback: describe_fallback
  describe_fallback:
    provider: openai
    model: openai/gpt-4.1-mini
    temperature: 0.2
    max_output_tokens: 80
    image_detail: low
    timeout_s: 8
  analyze:
    provider: groq
    model: openai/gpt-oss-20b
    reasoning_effort: low
    temperature: 0.3
    max_output_tokens: 800
    timeout_s: 10
    fallback: analyze_fallback
  analyze_hard:
    provider: groq
    model: openai/gpt-oss-120b
    reasoning_effort: medium
    temperature: 0.3
    max_output_tokens: 1200
    timeout_s: 15
    fallback: analyze_fallback
  analyze_fallback:
    provider: openai
    model: openai/gpt-4.1-mini
    temperature: 0.3
    max_output_tokens: 400
    timeout_s: 10
  reason:
    provider: openai
    model: openai/gpt-4.1-mini
    temperature: 0.2
    max_output_tokens: 600
    timeout_s: 20
    fallback: reason_fallback
  reason_fallback:
    provider: groq
    model: openai/gpt-oss-120b
    reasoning_effort: medium
    temperature: 0.2
    max_output_tokens: 1500
    timeout_s: 20
  live_read:
    provider: openai
    model: openai/gpt-4.1-mini
    temperature: 0.6
    max_output_tokens: 250
    image_detail: low
    timeout_s: 10
  chat:
    provider: groq
    model: openai/gpt-oss-120b
    reasoning_effort: low
    temperature: 0.5
    max_output_tokens: 800
    stream: true
    timeout_s: 5            # hasta el primer token
    fallback: chat_fallback
  chat_fallback:
    provider: openai
    model: openai/gpt-4.1-mini
    temperature: 0.5
    max_output_tokens: 400
    stream: true
    timeout_s: 5
  tts:
    provider: openai
    model: tts-1
    voice: nova
    format: mp3
    timeout_s: 10

prices_usd_per_1m:
  openai/gpt-4.1-nano:   { input: 0.10,  cached_input: 0.025, output: 0.40 }
  openai/gpt-4.1-mini:   { input: 0.40,  cached_input: 0.10,  output: 1.60 }
  openai/gpt-oss-20b:    { input: 0.075, output: 0.30 }   # servido por groq; pendiente de verificar (Vercel lista 0.08 de entrada)
  openai/gpt-oss-120b:   { input: 0.15,  output: 0.60 }   # servido por groq
  openai/tts-1: { per_1m_characters: null }   # verificar antes de la Fase 0
