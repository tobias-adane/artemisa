name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artemisa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artemisa_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos
        run: uv run mypy artemisa tests
      - name: Simular lo mínimo de Supabase en la base de test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/supabase_shim.sql
      - name: Tests y guardas
        run: uv run pytest -v -rs

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests y guardas
        run: npm test
